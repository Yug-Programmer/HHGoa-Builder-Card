openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HH Goa Builder Card Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cards
    description: Builder card operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cards:
    post:
      operationId: saveCard
      tags: [cards]
      summary: Save a generated builder card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Card saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cards/{id}:
    get:
      operationId: getCard
      tags: [cards]
      summary: Get a saved builder card by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/cards:
    get:
      operationId: adminListCards
      tags: [admin]
      summary: List all cards (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: List of all cards with private data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCardList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CardInput:
      type: object
      required:
        - imageBase64
        - name
      properties:
        imageBase64:
          type: string
        name:
          type: string
        role:
          type: ["string", "null"]
        stack:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        githubUsername:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        linkedinHandle:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        builderTitle:
          type: ["string", "null"]
        gmail:
          type: ["string", "null"]
          description: Gmail address (admin only, not shown on card)
        mobileNumber:
          type: ["string", "null"]
          description: Mobile number (admin only, not shown on card)

    Card:
      type: object
      required: [id, name, imageUrl, shareUrl, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: ["string", "null"]
        stack:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        githubUsername:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        linkedinHandle:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        builderTitle:
          type: ["string", "null"]
        imageUrl:
          type: string
        shareUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminCard:
      type: object
      required: [id, name, imageUrl, shareUrl, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: ["string", "null"]
        stack:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        githubUsername:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        linkedinHandle:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        builderTitle:
          type: ["string", "null"]
        gmail:
          type: ["string", "null"]
        mobileNumber:
          type: ["string", "null"]
        imageUrl:
          type: string
        shareUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminCardList:
      type: object
      required: [cards, total, page, limit]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/AdminCard"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
